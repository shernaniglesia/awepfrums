<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        background: linear-gradient(rgba(30,60,114,0.95), rgba(42,82,152,0.95)), 
                    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23e3f2fd" width="1200" height="600"/><circle fill="%231e3c72" opacity="0.1" cx="200" cy="150" r="80"/><circle fill="%232a5298" opacity="0.1" cx="1000" cy="400" r="120"/><path fill="%23bbdefb" opacity="0.3" d="M0 300 Q300 200 600 350 Q900 450 1200 300 L1200 600 L0 600 Z"/></svg>');
        background-size: cover;
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: .5rem;
    }

    .reset-container {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(15px);
        padding: 2rem 1rem;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0,0,0,0.25);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
        animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .reset-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #ff6b35, #1e3c72, #ff6b35);
        background-size: 200% 100%;
        animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1e3c72;
        margin-bottom: 1rem;
        line-height: 1.2;
    }

    .subtitle {
        color: #64748b;
        font-size: 1.05rem;
        margin-bottom: 2.75rem;
        font-weight: 400;
        line-height: 1.6;
    }

    /* Form Elements */
    .input-group {
        position: relative;
        margin-bottom: 2.25rem;
        text-align: left;
    }

    .input-group label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.875rem;
        font-size: 0.975rem;
        font-weight: 500;
        color: #374151;
    }

    .input-group input {
        width: 100%;
        padding: 1.375rem 1.75rem 1.375rem 3rem;
        border: 3px solid #e2e8f0;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .input-group input:focus {
        border-color: #ff6b35;
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15), 0 20px 40px rgba(255, 107, 53, 0.25);
        transform: translateY(-3px);
        background: white;
    }

    .input-group input.error {
        border-color: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.25);
        animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    /* Password Toggle */
    .toggle-password {
        position: absolute;
        right: 1.25rem;
        top: 60%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 1.1rem;
        color: #9ca3af;
        transition: all 0.3s ease;
        user-select: none;
        padding: 0.5rem;
        border-radius: 8px;
    }

    .toggle-password:hover {
        color: #ff6b35;
        background: rgba(255, 107, 53, 0.1);
    }

    /* Input Icons */
    .input-icon {
        position: absolute;
        left: 1.25rem;
        top: 60%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 1.1rem;
        z-index: 2;
    }

    /* Error Messages */
        .error {
            font-size: 0.875rem;
            color: #ef4444;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            animation: slideDown 0.4s ease-out;
            font-weight: 500;
        }

        

        .success {
            font-size: 13px;
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Reset Button */
        .reset-btn {
            width: 100%;
            padding: 1.4rem 2.25rem;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .reset-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transition: left 0.7s;
        }

        .reset-btn:hover::before {
            left: 100%;
        }

        .reset-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(255, 107, 53, 0.5);
        }

        .reset-btn:active {
            transform: translateY(-2px);
        }

        .reset-btn:disabled {
            background: linear-gradient(135deg, #ffa48d, #ffb3a7);
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.25);
        }

    @media (max-width: 400px) {
        .reset-container {
            width: 90%;
        }
    }
</style>
</head>

<body>

<div class="reset-container">
    <h2>Create New Password</h2>
    <p class="subtitle">Your new password must be strong and secure. Create a password you'll remember.</p>

    <form id="resetForm">

        <div class="success" id="successMessage"></div>

        <div class="input-group">
            <label><i class="fas fa-lock"></i>  New Password</label>
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Enter your new password">
            <span class="toggle-password" onclick="togglePassword('password')">
                <i class="fas fa-eye-slash"></i>
            </span>
            <div class="error" id="passwordError"></div>
        </div>

        <div class="input-group">
            <label><i class="fas fa-lock"></i> Confirm Password</label>
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                <i class="fas fa-eye-slash"></i>
            </span>
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="reset-btn"><i class="fas fa-sync-alt"></i>
                    Update Password</button>

    </form>
</div>

<div id="feedbackContainer"></div>

<script>

// Get token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
const form = document.getElementById("resetForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const passwordError = document.getElementById("passwordError");
const confirmPasswordError = document.getElementById("confirmPasswordError");
const successMessage = document.getElementById("successMessage");

// Show/Hide Toggle
function togglePassword(id) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}

// Form Submit
form.addEventListener("submit", async function(e) {
    e.preventDefault();

    let valid = true;
    passwordError.textContent = "";
    confirmPasswordError.textContent = "";
    successMessage.textContent = "";

    // Password
    const passValue = password.value;

    if (passValue.trim() === "") {
            document.getElementById("passwordError").textContent = "Password is required.";
            valid = false;
        } else if (passValue.length < 8) {
            document.getElementById("passwordError").textContent = "Minimum 8 characters.";
            valid = false;
        } else if (!/[A-Z]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain uppercase letter.";
            valid = false;
        } else if (!/[a-z]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain lowercase letter.";
            valid = false;
        } else if (!/[0-9]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain a number.";
            valid = false;
        } else if (!/[@$!%*?&]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain special character.";
            valid = false;
        }

    if (confirmPassword.value.trim() === "") {
        confirmPasswordError.textContent = "Confirm your password.";
        valid = false;
    } else if (password.value !== confirmPassword.value) {
        confirmPasswordError.textContent = "Passwords do not match.";
        valid = false;
    }

    if (!token) {
        alert("Invalid or missing token.");
        return;
    }

    if (valid) {
        try {
            const response = await fetch("http://localhost:5000/auth/resetPassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    newPassword: password.value
                })
            });

            const data = await response.json();

            if (response.ok) {
                successMessage.textContent = data.message;
                showFeedback("success", "Success", data.message);
                form.reset();
                
                setTimeout(() => {
                    window.location.href = "Login.html";
                }, 5000);

            } else {
                //alert(data.message);
                showFeedback("error", "Network Error", data.message);
            }

        } catch (error) {
            //alert("Something went wrong.");
            showFeedback("error", "Network Error", "Unable to connect to the server.");
        }
    }
});

fetch("Modal.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("feedbackContainer").innerHTML = html;
});

function showFeedback(type, title, message) {
    const modal = document.getElementById("feedbackModal");
    const icon = document.getElementById("feedbackIcon");
    const titleEl = document.getElementById("feedbackTitle");
    const msgEl = document.getElementById("feedbackMessage");

    icon.className = "bi";

    if (type === "success") {
        icon.classList.add("bi-check-circle-fill", "feedback-success");
    } else if (type === "error") {
        icon.classList.add("bi-x-circle-fill", "feedback-error");
    } else {
        icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
    }

    titleEl.textContent = title;
    msgEl.textContent = message;

    modal.style.display = "flex";

    document.getElementById("feedbackClose").onclick = () => {
        modal.style.display = "none";
    };

    modal.onclick = (e) => {
        if (e.target === modal) modal.style.display = "none";
    };
}
</script>

</body>
</html>
