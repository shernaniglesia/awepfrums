<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="NewStyle.css">
    <style>
        @media (max-width: 768px) {
            .firstColumn{
                width: 75%;
                word-wrap: break-word;
            }
            .fourthColumn{
                width: 90px;
                text-align: center;
            }
            th:nth-child(2), td:nth-child(2),
            td:nth-child(4) { 
                display: table-cell;
            }

            th:nth-child(2),
            th:nth-child(3) {
                display: none;
            }

            td.user-cell {
                white-space: normal;
                line-height: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <nav>
            <div class="navHeader">
                <p class="navHeaderTitle">Admin Panel</p>
                <button id="menuBtn" class="menuBtn">☰</button>
            </div>
            <a class="navLink active" href="AdminDashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
            <a class="navLink" href="AdminManageUser.html"><i class="fas fa-users"></i>Users</a>
            <a class="navLink" href="AdminManageRoom.html"><i class="fas fa-door-open"></i>Rooms</a>
            <a class="navLink" href="AdminManageRoomReservation.html"><i class="fas fa-calendar-check"></i>Room Reservation</a>
            <a class="navLink" href="AdminManageEquipment.html"><i class="fas fa-boxes"></i>Equipments</a>
            <a class="navLink" href="AdminManageEquipmentReservation.html"><i class="fas fa-tools"></i>Equipment Reservation</a>
            <a class="navLink" href="AdminViewActivityLog.html"><i class="fas fa-history"></i>Activity Log</a>
            <a class="navLink" href="AdminManageSemester.html"><i class="fas fa-calendar-alt"></i>Semesters</a>
            <a class="navLink" href="AdminManageSubject.html"><i class="fas fa-book"></i>Subjects</a>
            <a class="navLink" href="AdminManageYearSection.html"><i class="fas fa-layer-group"></i>Year & Sections</a>
        </nav>
    </aside>

    <div id="overlay" class="overlay"></div>

    <main id="main">
        <div id="mainHeader">

            <div class="mainHeaderLeft">
                <button id="menuBtn2" class="menuBtn2">☰</button>
                <h3 class="mainHeaderLeftTitle">AWE-PFRUMS</h3>
            </div>

            <div class="searchContainer">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                <input id="searchInput" type="search" placeholder="Search...">
            </div>

            <div class="mainHeaderRight">
                <!-- Notification Button -->
                <div class="notif-container" id="notif-bell">
                        <i class="fas fa-bell"></i> <span id="notif-count" class="badge">0</span>
                    <div id="notif-dropdown" class="dropdown hidden">
                        <div class="dropdown-header">Notifications</div>
                        <ul id="notif-list"></ul>
                    </div>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-container">
                    <div class="profile-avatar" id="profileAvatar">a</div>

                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-info">
                            <div class="mini-profile-avatar" id="miniProfileAvatar">A</div>
                            <div class="sub-profile-info">
                                <div class="profile-name" id="profileName">Shernan  C. Iglesia</div>
                                <div class="profile-role" id="profileRole">Admin</div>
                            </div>
                        </div>
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            My Profile
                        </a>
                        <a href="AdminChangePassword.html" class="dropdown-item">
                            <i class="fas fa-key"></i>
                            Change Password
                        </a>
                        <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </a>
                    </div>

                </div>
            </div>

        </div>

        <div class="mainContent">
            <div class="mainContentHeader">
                <p class="mainContentHeaderText"><i class="fas fa-users"></i> User Management</p>
                <button class="mainContentHeaderText" id="addButton">
                    <i class="fa-solid fa-plus"></i> Add User</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="firstColumn">Name</th>
                        <th class="secondColumn">Role</th>
                        <th class="thirdColumn">Email</th>
                        <th class="fourthColumn">Action</th>
                    </tr>
                </thead>

                <tbody id="dataTableBody"></tbody>
            </table>
        </div>

        <div id="feedbackContainer"></div>
        <div id="logoutContainer"></div>

    </main>
    <script src="NewScript.js"></script>
    <script>
        const API = "http://localhost:5000";
        const token = localStorage.getItem("accessToken");
        const role = localStorage.getItem("userRole");

        fetch("Modal.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("feedbackContainer").innerHTML = html;
            document.getElementById("logoutContainer").innerHTML = html;

            if (!token || role !== "admin") {
                showFeedback("warning", "Access denied.", "Admins only!");

                setTimeout(() => {
                    window.location.href = "Login.html";
                }, 1500);
            }
        });

        window.addEventListener("resize", () => {
           
        });
  
        initUserProfile();
        fetchNotifications();
    </script>
</body>
</html>
