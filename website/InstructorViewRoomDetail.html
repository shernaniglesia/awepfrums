<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3c72;
            --secondary-blue: #2a5298;
            --primary-orange: #ff6b35;
            --orange-hover: #ff8c5a;
            --sidebar-dark: #0f172a;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --dark-text: #1e293b;
            --gray-text: #64748b;
            --light-gray: #e2e8f0;
            --border-gray: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navigationContainer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: .7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #backButton, #addButton {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.3rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            text-decoration: none;
            font-size: 0.95rem;
        }

        #backButton:hover, #addButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        .roomSemContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mainHeader-title, #semesterInfo {
            color: #1e3c72;
            padding: .4rem;
        }

        .weekNavigationContainer {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: .7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 20px;
            margin: 0 0 1rem 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-button {
            padding: 0.55rem 1rem;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .timetableContainer {
            flex: 1;
            padding: 0 2rem 2rem;
            overflow: hidden;
        }

        .timetable {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
            height: 100%;
        }

        .header-row { 
            display: flex;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .header-cell { 
            flex: 1;
            text-align: center;
            padding: .2rem 0.1rem;
            font-size: 0.78rem;
            font-weight: 500;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .today { 
            background: linear-gradient(135deg, #fef3c7, #fde68a) !important;
            color: #92400e !important;
            box-shadow: inset 0 0 0 2px rgba(255, 193, 7, 0.3);
            position: relative;
        }
    
        .day-column { 
            flex: 1;
            position: relative;
            border-left: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
        }
        
        .event { 
            position: absolute;
            left: 0;
            right: 0;
            margin: 0.1rem;
            border-radius: 12px;
            font-size:10px; 
            font-weight: 600;
            color: #1e3c72;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.8);
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .event:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 35px rgba(255,107,53,0.3);
            border-color: #ff6b35;
            background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,243,199,0.9));
        }

        .time-gutter { 
            width: 50px;
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
        }

        .time-cell { 
            font-size:10px; 
            color:#6b7280; 
            height:40px; 
            text-align:right; 
            padding-right:6px; 
        }

        .row { 
            display: flex;
            min-height: 50px; 
        }

        #evTitle {
            font-size: 14px;
            color: #000;
        }

        #evInstructor {
            font-size: 12px;
            color: #000;
        }
        
        .modal-overlay { 
            display:none; 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%; 
            background:rgba(0,0,0,0.5); 
            justify-content:center; 
            align-items:center; 
            z-index: 3000;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box { 
            width: 330px; 
            border-radius:12px; 
            padding:10px 20px 20px 20px; 
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            transform: scale(0.8) translateY(20px);
            animation: modalSlideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s both;
            position: relative;
            overflow-y: auto;
        }

        @keyframes modalSlideUp {
            to {
                transform: scale(1) translateY(0);
            }
        }

        #closeModalButton{
            background-color: white;
            padding: 0;
            border: none;
            font-size: 1.7rem;
            font-weight: 500;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin: 0;
            cursor: pointer;
        }
        .modal-title { 
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            text-align: center;
        }
        
        .modal-btn { 
            flex:1; 
            padding: 8px 15px;
            font-size:14px; 
            margin:5px; 
            border-radius:6px; 
            text-align:center; 
            font-weight:bold; 
            cursor:pointer; 
            color:white; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-btn.green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .modal-btn.green:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
        }

        .modal-btn.gray {
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            color: white;
            box-shadow: 0 4px 15px rgba(107, 114, 128, 0.3);
        }

        .modal-btn.gray:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 114, 128, 0.4);
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #fff;
            width: 330px;
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 8px;
            font-size: 28px;
            cursor: pointer;
            color: #444;
        }
        .close-btn:hover {
            color: #000;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            font-size: 16px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-family: inherit;
            background: var(--light-bg);
            outline: none;
            appearance: none;
        }

        .input-field:focus {
            border-color: var(--primary-orange);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
            transform: translateY(-1px);
        }

        .input-field-picker {
            width: 99%;
        }
        
        .modal-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background: var(--primary-blue);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-btn:hover {
            transform: scale(1.1);
        }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 768px) {
            .navigationContainer, 
            .weekNavigationContainer {
                padding: .5rem .5rem;
            }
            .timetableContainer {
                padding: 0;
            }
            .mainContent{
                height: 77.5vh;
                padding: 5px;
            }
            #evTitle {
                font-size: 8px;
                color: #000;
            }
            #evInstructor {
                font-size: 7px;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div class="navigationContainer">
        <button id="backButton"><i class="bi bi-arrow-left"></i> Back</button>
        <button id="addButton"><i class="bi bi-plus"></i>Reserve Room</button>
    </div>

    <div class="roomSemContainer">
        <h4 id="mainHeader-title">Room Assignment</h4>
        <h4 id="semesterInfo"></h4>
    </div>

    <div class="weekNavigationContainer">
        <button id="prevBtn" class="nav-button">
            <i class="bi bi-chevron-left"></i>
            Previous
        </button>
        <div class="week-range" id="weekRange">Loading...</div>
        <button id="nextBtn" class="nav-button">
            Next
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>

    <div class="timetableContainer">
        <div id="timetable" class="timetable"></div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <button id="closeModalButton" onclick="closeModal()">x</button>
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalContent"></div>
            <div style="display:flex; margin-top:20px;" id="modalActions"></div>
        </div>
    </div>

    <div id="feedbackContainer"></div>

    <div id="reserveRoomModal" class="custom-modal">
        <div class="modal-content">
            <span id="closeReserveModal" class="close-btn">&times;</span>
            <h3 class="modal-title">Reserve Room</h3>

            <form id="reserveRoomForm">
                <label>Room name</label>
                <input type="text" id="reserveRoom" class="input-field" disabled>

                <label>Subject code</label>
                <select id="reserveSubject" class="input-field input-field-picker">
                    <option value="">Select subject code</option>
                </select>
                <p id="formErrorReserveSubjectCode" class="error-msg"></p>

                <label>Year and Section</label>
                <select id="reserveYearSection" class="input-field input-field-picker">
                    <option value="">Select year and section</option>
                </select>
                <p id="formErrorReserveYearSection" class="error-msg"></p>

                <label>Date</label>
                <input id="reserveDate" type="date" class="input-field">
                <p id="formErrorReserveDate" class="error-msg"></p>

                <label>Start Time</label>
                <input type="time" id="reserveStartTime" class="input-field">
                <p id="formErrorReserveStartTime" class="error-msg"></p>

                <label>End Time</label>
                <input type="time" id="reserveEndTime" class="input-field">
                <p id="formErrorReserveEndTime" class="error-msg"></p>
                
                <button type="submit" class="modal-btn">Submit</button>
            </form>
        </div>
    </div>

    <script src="InstructorViewRoomDetail.js">
    </script>
</body>
</html>
