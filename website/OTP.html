<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(30,60,114,0.95), rgba(42,82,152,0.95)), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23e3f2fd" width="1200" height="600"/><circle fill="%231e3c72" opacity="0.1" cx="200" cy="150" r="80"/><circle fill="%232a5298" opacity="0.1" cx="1000" cy="400" r="120"/><path fill="%23bbdefb" opacity="0.3" d="M0 300 Q300 200 600 350 Q900 450 1200 300 L1200 600 L0 600 Z"/></svg>');
            background-size: cover;
            background-attachment: fixed;
            padding: 2rem;
            position: relative;
        }

        .otp-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .otp-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b35, #1e3c72, #ff6b35);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.75rem;
        }

        .otp-inputs input {
            flex: 1;
            width: 40px;
            height: 60px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            border: 3px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            letter-spacing: 1px;
        }

        .otp-inputs input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15), 0 12px 30px rgba(255, 107, 53, 0.2);
            transform: translateY(-3px);
        }

        .otp-inputs input.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
            animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .btn {
            width: 100%;
            padding: 1.25rem 2rem;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 30px rgba(255, 107, 53, 0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(255, 107, 53, 0.4);
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #ffa48d, #ffb3a7);
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.2);
        }

        .resend-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 16px;
            border: 2px solid #e2e8f0;
        }

        .resend-btn {
            background: transparent;
            color: #1e3c72;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
        }

        .resend-btn:hover:not(:disabled) {
            background: rgba(30, 60, 114, 0.1);
            color: #ff6b35;
            transform: translateY(-1px);
        }

        .resend-btn:disabled {
            color: #94a3b8;
            cursor: not-allowed;
        }

        .timer {
            color: #64748b;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .error, .info {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .error { color: red; }
        .info { color: #333; }

        @media (max-width: 460px) {
            .otp-inputs {
                display: flex;
                justify-content: space-between;
                margin-bottom: 1.75rem;
            }

            .otp-inputs input {
                width: 25px;
                height: 40px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h2>Enter otp</h2>
        <p class="subtitle" id="infoText">Enter the 6-digit code sent to your registered email</p>
        <div class="otp-inputs" id="otpInputs">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
        </div>
        <div class="error" id="errorText"></div>
        <button class="btn" id="verifyBtn"><i class="fas fa-check-circle"></i>Verify OTP</button>

        <!-- Resend Container -->
        <div class="resend-container">
            <button class="resend-btn" id="resendBtn">
                <i class="fas fa-redo"></i>
                Resend OTP
            </button>
            <span class="timer" id="timerText"></span>
        </div>
        
    </div>

    <div id="feedbackContainer"></div>

    <script>
        const API = "http://localhost:5000";
        const email = localStorage.getItem("otp_email");
        const role = localStorage.getItem("otp_role");
        
        // 1. Get the query string (?status=Verified)
        const urlParams = new URLSearchParams(window.location.search);

        // 2. Get the specific value by the key "status"
        const receivedWord = urlParams.get('status');

        const otpInputs = document.querySelectorAll("#otpInputs input");
        const verifyBtn = document.getElementById("verifyBtn");
        const resendBtn = document.getElementById("resendBtn");
        const errorText = document.getElementById("errorText");
        const infoText = document.getElementById("infoText");
        const timerText = document.getElementById("timerText");

        // ================= AUTO-JUMP & PASTE SUPPORT =================
        otpInputs.forEach((input, idx) => {
            input.addEventListener("input", (e) => {
                const val = e.target.value;
                if (/[^0-9]/.test(val)) e.target.value = "";
                if (val && idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && idx > 0) {
                    otpInputs[idx - 1].focus();
                }
            });

            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData("text").trim();
                if (/^\d{6}$/.test(paste)) {
                    otpInputs.forEach((inp, i) => inp.value = paste[i]);
                }
            });
        });

        // ================= RESEND OTP WITH COUNTDOWN =================
        function startResendCountdown() {
            resendCountdown = 45;
            resendBtn.disabled = true;
            
            countdownInterval = setInterval(() => {
                resendCountdown--;
                timerText.textContent = `Resend available in ${resendCountdown}s`;
                
                if (resendCountdown <= 0) {
                    clearInterval(countdownInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend OTP';
                    timerText.textContent = "";
                } else {
                    resendBtn.innerHTML = `<i class="fas fa-clock"></i> Wait ${resendCountdown}s`;
                }
            }, 1000);
        }

        // ================= VERIFY OTP =================
        verifyBtn.addEventListener("click", async () => {
            errorText.textContent = "";

            const otp = Array.from(otpInputs).map(i => i.value).join("");
            if (otp.length < 6) {
                errorText.textContent = "Please enter all 6 digits";
                return;
            }

            verifyBtn.disabled = true;
            
            try {
                const res = await fetch(`${API}/auth/verifyOTP`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, role, otp })
                });

                const data = await res.json();
                
                if (!res.ok) {
                        //errorText.textContent = data.message || "Incorrect OTP";
                        showFeedback("error", "Error", data.message || "Incorrect OTP");
                        otpInputs.forEach(i => i.value = "");
                        otpInputs[0].focus();
                } else {
                    if(receivedWord === ("resetPassword")){
                        // alert("Verification successful");
                        // window.location.href = "ResetPassword.html";

                        //alert("OTP verified. You can now reset your password.");
                        showFeedback("success", "Success", "OTP verified. You can now reset your password.");
                        window.location.href = `ResetPassword.html?token=${data.resetToken}`;
                    }else{
                        //alert("Account verified successfully!");
                        showFeedback("success", "Success", "Account verified successfully!");
                        window.location.href = "Login.html";
                    }
                }
            } catch (err) {
                console.error(err);
                errorText.textContent = "Server error";
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            } finally {
                verifyBtn.disabled = false;
            }
        });

        function disableInputs() {
            otpInputs.forEach(i => i.disabled = true);
            verifyBtn.disabled = true;
        }

        // ================= RESEND OTP =================
        resendBtn.addEventListener("click", async () => {
            resendBtn.disabled = true;
            try {
                const res = await fetch(`${API}/auth/requestOTP`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, role })
                });
                const data = await res.json();

                if (res.ok) {
                    showFeedback("success", "Success", "New OTP sent! Check your email.");
                    otpInputs.forEach(i => { i.value = ""; i.disabled = false; });
                    verifyBtn.disabled = false;
                    otpInputs[0].focus();
                    startResendCountdown();
                } else {
                    // errorText.textContent = data.message || "Failed to resend OTP";
                    showFeedback("error", "Error", data.message || "Failed to resend OTP");
                }
            } catch (err) {
                console.error(err);
                errorText.textContent = "Unable to contact server";
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        });

        // Initialize countdown on page load
        startResendCountdown();

        fetch("Modal.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("feedbackContainer").innerHTML = html;
        });

        function showFeedback(type, title, message) {
            const modal = document.getElementById("feedbackModal");
            const icon = document.getElementById("feedbackIcon");
            const titleEl = document.getElementById("feedbackTitle");
            const msgEl = document.getElementById("feedbackMessage");

            icon.className = "bi";

            if (type === "success") {
                icon.classList.add("bi-check-circle-fill", "feedback-success");
            } else if (type === "error") {
                icon.classList.add("bi-x-circle-fill", "feedback-error");
            } else {
                icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
            }

            titleEl.textContent = title;
            msgEl.textContent = message;

            modal.style.display = "flex";

            document.getElementById("feedbackClose").onclick = () => {
                modal.style.display = "none";
            };

            modal.onclick = (e) => {
                if (e.target === modal) modal.style.display = "none";
            };
        }
    </script>
</body>
</html>
