<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3c72;
            --secondary-blue: #2a5298;
            --primary-orange: #ff6b35;
            --orange-hover: #ff8c5a;
            --sidebar-dark: #0f172a;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --dark-text: #1e293b;
            --gray-text: #64748b;
            --light-gray: #e2e8f0;
            --border-gray: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #main {
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            padding-top: 70px;
        }

        #mainHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            background: var(--white);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            backdrop-filter: blur(20px);
            padding: 0 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 998;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mainHeaderLeft {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        #backButton {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.3rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            text-decoration: none;
            font-size: 0.95rem;
        }

        #backButton:hover{
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        .searchContainer{
            padding: 0;
            width: 40vw;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        #searchInput{
            height: 35px;
            border-radius: 16px;
            background-color: var(--light-gray);
            padding-left: 2.5rem;
            border: 2px solid var(--light-gray);
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
            outline: none;
            appearance: none;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary-orange);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
        }

        #searchIcon{
            position: absolute;
            color: var(--gray-text);
            padding-left: 1rem;
        }

        .mainHeaderLeftTitle {
            color: var(--primary-blue);
            font-size: 1.5rem;
        }

        .mainContent {
            background: var(--white);
            margin: 1.5rem;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            backdrop-filter: blur(20px);
        }

        .mainContentHeader {
            background: var(--primary-blue);
            border-radius: 6px 6px 0 0;
            padding: .6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mainContentHeaderText {
            color: var(--white);
            font-size: 1rem;
        }

        #addButton{
            background-color: var(--light-gray);
            color: var(--primary-blue);
            padding: .3rem .6rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #addButton:hover {
            transform: scale(1.05);
        }

        /* Table */
        table {
            width: 100%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
        }

        thead, tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        th, td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: var(--white);
            color: var(--dark-text);
            text-transform: uppercase;
            font-weight: 600;
            font-size: 15px;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #e9e9e9;
            cursor: pointer;
        }

        .editButton {
            padding: 8px 15px;
            background: var(--primary-blue);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: .9rem;
        }

        .editButton:hover {
            transform: scale(1.05);
        }

        .sixthColumn{
            width: 110px;
        }
        .days { 
            display: flex; 
            flex-wrap: wrap; 
            margin-top: 7px; 
        }
        .day-btn { 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            padding: 10px; 
            margin: 3px; 
            cursor: pointer; 
            width: 42px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .day-btn.selected { 
            background: var(--primary-blue); 
            color: white; 
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .modal-content {
            background: #fff;
            width: 330px;
            padding: 20px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .close-btn {
            position: absolute;
            right: 15px;
            top: 8px;
            font-size: 28px;
            cursor: pointer;
            color: #444;
        }
        .close-btn:hover {
            color: #000;
        }
        .modal-content h3 {
            margin-top: 10px;
            color: #0f172a;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            font-size: 16px;
            border: 2px solid var(--light-gray);
            border-radius: 6px;
            font-family: inherit;
            background: var(--light-bg);
            outline: none;
            appearance: none;
        }

        .input-field:focus {
            border-color: var(--primary-orange);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
            transform: translateY(-1px);
        }

        .input-field-picker {
            width: 99%;
        }

        #togglePassword {
            position: absolute;
            right: 30px;
            bottom: 105px;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background: var(--primary-blue);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-btn:hover {
            transform: scale(1.1);
        }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            th:nth-child(1), td:nth-child(1) { 
                display: table-cell;
            }
            th:nth-child(2),
            th:nth-child(3),
            th:nth-child(4),
            th:nth-child(5){
                display: none;
            }

            td.data-cell {
                white-space: normal;
                line-height: 1.4rem;
            }

            #mainHeader {
                padding: 1rem 1.5rem;
                flex-direction: row;
                gap: 1rem;
                align-items: stretch;
                width: 100vw;
            }

            .mainHeaderLeftTitle {
                display: none;
            }

            .mainContent {
                margin: 1rem .2rem;
            }
        }
    </style>
</head>
<body>
    <main id="main">
        <div id="mainHeader">
            <div class="mainHeaderLeft">
                <button id="backButton"><i class="bi bi-arrow-left"></i> Back</button>
            </div>

            <div class="searchContainer">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                <input id="searchInput" type="search" placeholder="Search...">
            </div>
            <h3 class="mainHeaderLeftTitle">AWE-PFRUMS</h3>
        </div>

        <div class="mainContent">
            <div class="mainContentHeader">
                <p class="mainContentHeaderText"><i class="fas fa-calendar-alt"></i> Schedule Management</p>
                <button class="mainContentHeaderText" id="addButton">
                <i class="fa-solid fa-plus"></i> Add Schedule</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th id="firstColumn">Subject Code</th>
                        <th>Instructor Name</th>
                        <th>Year & Section</th>
                        <th>Day/s</th>
                        <th>Time</th>
                        <th class="sixthColumn">Action</th>
                    </tr>
                </thead>

                <tbody id="dataTableBody"></tbody>
            </table>
        </div>

        <div id="feedbackContainer"></div>

        <div id="scheduleModal" class="custom-modal">
            <div class="modal-content">
                <span id="closeModal" class="close-btn">&times;</span>
                <h3 id="modalTitle" class="modal-title">Add Room</h3>

                <form id="addScheduleForm">
                    <label>Subject code</label>
                    <select id="subject" class="input-field input-field-picker">
                        <option value="">Select subject code</option>
                    </select>
                    <p id="formErrorSubjectCode" class="error-msg"></p>

                    <label>Instructor</label>
                    <select id="instructor" class="input-field input-field-picker">
                        <option value="">Select instructor</option>
                    </select>
                    <p id="formErrorInstructor" class="error-msg"></p>

                    <label>Year and Section</label>
                    <select id="yearSection" class="input-field input-field-picker">
                        <option value="">Select year and section</option>
                    </select>
                    <p id="formErrorYearSection" class="error-msg"></p>

                    <label>Select Days</label>
                    <div class="days" id="daysContainer"></div>
                    <p id="formErrorDays" class="error-msg"></p>

                    <label>Start Time</label>
                    <input type="time" id="startTime" class="input-field">
                    <p id="formErrorStartTime" class="error-msg"></p>

                    <label>End Time</label>
                    <input type="time" id="endTime" class="input-field">
                    <p id="formErrorEndTime" class="error-msg"></p>
                    
                    <button type="submit" class="modal-btn" id="modalBtn">Add Schedule</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const API = "http://localhost:5000";
        const token = localStorage.getItem("accessToken");
        const role = localStorage.getItem("userRole");
        if (!token) {
            window.location.href = "Login.html";
        }

        if (role !== "admin") {
            showFeedback("warning", "Access denied.", "Admins only!");
            window.location.href = "Login.html";
        }

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get("roomId");
        const roomName = urlParams.get("roomName");
        const semesterData = {};
        urlParams.forEach((value, key) => {
            if (key !== "roomId" && key !== "roomName") {
                semesterData[key] = value;
            }
        });

        const encodedName = encodeURIComponent(roomName);
        let dataToPass = `roomId=${roomId}&roomName=${encodedName}`;

        if (semesterData) {
            Object.keys(semesterData).forEach(key => {
                dataToPass += `&${encodeURIComponent(key)}=${encodeURIComponent(semesterData[key])}`;
            });
        }
        const backButton = document.getElementById("backButton");
        backButton.addEventListener("click", () => {
            window.location.href=`AdminManageRoomDetail.html?${dataToPass}`;
        });

        let schedules = [];
        let fullSchedules = [];
        let selectedSchedules = [];

        const dataTableBody = document.getElementById("dataTableBody");
        const searchInput = document.getElementById("searchInput");
        const selectAllCheckbox = document.getElementById("selectAll");
        const deleteButton = document.getElementById("deleteButton");
        const addButton = document.getElementById("addButton");

        const modalTitle = document.getElementById("modalTitle");
        const modalBtn = document.getElementById("modalBtn");
        const scheduleModal = document.getElementById("scheduleModal");
        const closeModal = document.getElementById("closeModal");
        const addScheduleForm = document.getElementById("addScheduleForm");
        const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        let selectedDays = [];

        const daysContainer = document.getElementById("daysContainer");
        days.forEach(d => {
            const btn = document.createElement("div");
            btn.className = "day-btn";
            btn.innerText = d;
            btn.onclick = () => {
                if (selectedDays.includes(d)) {
                    selectedDays = selectedDays.filter(x => x !== d);
                    btn.classList.remove("selected");
                } else {
                    selectedDays.push(d);
                    btn.classList.add("selected");
                }
            };
            daysContainer.appendChild(btn);
        });

        const fTime = (timeStr) => {
            const [hour, minute] = timeStr.split(":");
            let h = parseInt(hour, 10);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${h}:${minute} ${ampm}`;
        };

        async function loadData() {
            try {
                const [subRes, instRes, ysRes] = await Promise.all([
                fetch(`${API}/subjects`),
                fetch(`${API}/users/instructors`),
                fetch(`${API}/year-sections`),
                ]);
                const subjects = await subRes.json();
                const instructors = await instRes.json();
                const yearSections = await ysRes.json();

                const subjectSelect = document.getElementById("subject");
                subjects.forEach(s => {
                subjectSelect.innerHTML += `<option value="${s.subject_id}">${s.subject_code}</option>`;
                });

                const instructorSelect = document.getElementById("instructor");
                instructors.forEach(i => {
                instructorSelect.innerHTML += `<option value="${i.instructor_id}">${i.instructor_name}</option>`;
                });

                const ysSelect = document.getElementById("yearSection");
                yearSections.forEach(ys => {
                ysSelect.innerHTML += `<option value="${ys.year_section_id}">${ys.year_section_name}</option>`;
                });
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        loadData();

        async function fetchSchedules() {
            try {
                const schedRes = await fetch(`${API}/schedules/roomsched/${roomId}`);
                if(schedRes.ok){
                    schedules = await schedRes.json();
                    fullSchedules = [...schedules];
                    renderTable();
                }
            } catch(err){
                console.error("Error fetching data:", err);
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        }

        function renderTable() {
            dataTableBody.innerHTML = "";
            const isMobile = window.innerWidth < 768;
            schedules.forEach(schedule => {
                const tr = document.createElement("tr");

                if (isMobile) {
                    document.getElementById("firstColumn").innerText = "Schedule";
                    const tdCombined = document.createElement("td");

                    tdCombined.innerHTML = `
                        <div class="data-cell">${schedule.subject+" ("+schedule.year_section+")"}<br>
                            ${schedule.instructor}<br>
                            <small>
                                ${schedule.days}<br>
                                ${fTime(schedule.schedule_start_time)} -    
                                ${fTime(schedule.schedule_end_time)}
                            <small>
                        </div>    
                    `;

                    tr.appendChild(tdCombined);
                }else{
                    document.getElementById("firstColumn").innerText = "Subject Code";

                    const subjectCode = document.createElement("td");
                    subjectCode.innerText = schedule.subject;
                    tr.appendChild(subjectCode);

                    const instructorName = document.createElement("td");
                    instructorName.innerText = schedule.instructor;
                    tr.appendChild(instructorName);

                    const yearSection = document.createElement("td");
                    yearSection.innerText = schedule.year_section;
                    tr.appendChild(yearSection);

                    const days = document.createElement("td");
                    days.innerText = schedule.days.join(", ");
                    tr.appendChild(days);

                    const time = document.createElement("td");
                    time.innerText = fTime(schedule.schedule_start_time)+" - "+ fTime(schedule.schedule_end_time);
                    tr.appendChild(time);
                }
                // Actions
                const tdAction = document.createElement("td");
                tdAction.classList.add("sixthColumn");
                const editBtn = document.createElement("button");
                editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit';
                editBtn.classList.add("editButton");
                editBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    openEditModal(schedule);
                });
                tdAction.appendChild(editBtn);
                tr.appendChild(tdAction);
                dataTableBody.appendChild(tr);
            });
        }

        searchInput.addEventListener("input", () => {
            const q = searchInput.value.toLowerCase();
            const rows = dataTableBody.querySelectorAll("tr");

            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(q) ? "" : "none";
            });
        });

        addButton.addEventListener("click", () => {
            modalTitle.innerText = "Add Schedule";
            modalBtn.innerText = "Add Schedule";
            addScheduleForm.reset();
            selectedDays = [];
            document.querySelectorAll(".day-btn").forEach(d => d.classList.remove("selected"));
            scheduleModal.style.display = "flex";
        });

         let editMode = false;
         let editScheduleId = null;

        function openEditModal(schedule){
            editMode = true;
            editScheduleId = schedule.schedule_id;
            document.getElementById("subject").value = schedule.subject_id;
            document.getElementById("instructor").value = schedule.instructor_id;
            document.getElementById("yearSection").value = schedule.year_section_id;
            document.getElementById("startTime").value = schedule.schedule_start_time;
            document.getElementById("endTime").value = schedule.schedule_end_time;
            
            selectedDays = schedule.days || [];

            document.querySelectorAll(".day-btn").forEach(btn => {
                btn.classList.toggle("selected", selectedDays.includes(btn.innerText));
            });

            formErrorSubjectCode.innerText = "";
            formErrorInstructor.innerText = "";
            formErrorYearSection.innerText = "";
            formErrorDays.innerText = "";
            formErrorStartTime.innerText = "";
            formErrorEndTime.innerText = "";
            modalTitle.innerText = "Edit Schedule";
            modalBtn.innerText = "Update Schedule";
            scheduleModal.style.display = "flex";
        }

        closeModal.addEventListener("click", () => {
            scheduleModal.style.display = "none";
        });

        addScheduleForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const subject = document.getElementById("subject").value;
            const instructor = document.getElementById("instructor").value;
            const yearSection = document.getElementById("yearSection").value;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;

            document.querySelectorAll(".error-msg").forEach(x => (x.textContent = ""));

            let hasError = false;

            if (!subject) {
                formErrorSubjectCode.textContent = "Please select a subject.";
                hasError = true;
            }

            if (!instructor) {
                formErrorInstructor.textContent = "Please select an instructor.";
                hasError = true;
            }

            if (!yearSection) {
                formErrorYearSection.textContent = "Please select year & section.";
                hasError = true;
            }

            if (selectedDays.length === 0) {
                formErrorDays.textContent = "Select at least one day.";
                hasError = true;
            }

            if (!startTime) {
                formErrorStartTime.textContent = "Start time required.";
                hasError = true;
            }

            if (!endTime) {
                formErrorEndTime.textContent = "End time required.";
                hasError = true;
            }

            if (startTime >= endTime) {
                formErrorEndTime.textContent = "End time must be later.";
                hasError = true;
            }

            if (hasError) return;

            const payload = {
                room_id: roomId,
                sem_id: semesterData.sem_id,
                subject_id: subject,
                instructor_id: instructor,
                year_section_id: yearSection,
                schedule_start_time: startTime,
                schedule_end_time: endTime,
                days: selectedDays,
            };
            try {
                const url = editMode 
                    ? `${API}/schedules/${editScheduleId}` 
                    : `${API}/schedules`;

                const method = editMode ? "PUT" : "POST";
                const res = await fetch(url, {
                    method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await res.json();
                if(!res.ok){
                    showFeedback("error", "Failed", data.message || "Failed to save schedule");
                } else {;
                    showFeedback(
                        "success",
                        "Success",
                        editMode ? "Schedule updated successfully!" : "Schedule added successfully!"
                    );
                }
                scheduleModal.style.display = "none";
                fetchSchedules();
            } catch(err){
                console.error(err);
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        });

        scheduleModal.addEventListener("click", (e) => {
            if(e.target === scheduleModal){
                scheduleModal.style.display = "none";
            }
        });

        window.addEventListener("resize", () => {
            fetchSchedules();
        });

        fetchSchedules();

        fetch("Modal.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("feedbackContainer").innerHTML = html;
        });

        function showFeedback(type, title, message) {
            const modal = document.getElementById("feedbackModal");
            const icon = document.getElementById("feedbackIcon");
            const titleEl = document.getElementById("feedbackTitle");
            const msgEl = document.getElementById("feedbackMessage");

            icon.className = "bi";

            if (type === "success") {
                icon.classList.add("bi-check-circle-fill", "feedback-success");
            } else if (type === "error") {
                icon.classList.add("bi-x-circle-fill", "feedback-error");
            } else {
                icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
            }

            titleEl.textContent = title;
            msgEl.textContent = message;

            modal.style.display = "flex";

            document.getElementById("feedbackClose").onclick = () => {
                modal.style.display = "none";
            };

            modal.onclick = (e) => {
                if (e.target === modal) modal.style.display = "none";
            };
        }
    </script>
</body>
</html>
