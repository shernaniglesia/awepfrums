<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navigationContainer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: .7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #backButton, #addButton {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.3rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            text-decoration: none;
            font-size: 0.95rem;
        }

        #backButton:hover, #addButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        .roomSemContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mainHeader-title, #semesterInfo {
            color: #1e3c72;
            padding: .4rem;
        }

        .weekNavigationContainer {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: .7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 20px;
            margin: 0 0 1rem 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-button {
            padding: 0.55rem 1rem;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .timetableContainer {
            flex: 1;
            padding: 0 2rem 2rem;
            overflow: hidden;
        }

        .timetable {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
            height: 100%;
        }

        .header-row { 
            display: flex;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .header-cell { 
            flex: 1;
            text-align: center;
            padding: .2rem 0.1rem;
            font-size: 0.78rem;
            font-weight: 500;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .today { 
            background: linear-gradient(135deg, #fef3c7, #fde68a) !important;
            color: #92400e !important;
            box-shadow: inset 0 0 0 2px rgba(255, 193, 7, 0.3);
            position: relative;
        }
    
        .day-column { 
            flex: 1;
            position: relative;
            border-left: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
        }
        
        .event { 
            position: absolute;
            left: 0;
            right: 0;
            margin: 0.1rem;
            border-radius: 12px;
            font-size:10px; 
            font-weight: 600;
            color: #1e3c72;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.8);
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .event:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 35px rgba(255,107,53,0.3);
            border-color: #ff6b35;
            background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,243,199,0.9));
        }

        .time-gutter { 
            width: 50px;
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
        }

        .time-cell { 
            font-size:10px; 
            color:#6b7280; 
            height:40px; 
            text-align:right; 
            padding-right:6px; 
        }

        .row { 
            display: flex;
            min-height: 50px; 
        }

        #evTitle {
            font-size: 14px;
            color: #000;
        }

        #evInstructor {
            font-size: 12px;
            color: #000;
        }
        
        .modal-overlay { 
            display:none; 
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%; 
            background:rgba(0,0,0,0.5); 
            justify-content:center; 
            align-items:center; 
            z-index: 3000;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box { 
            width: 330px; 
            border-radius:12px; 
            padding:10px 20px 20px 20px; 
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            transform: scale(0.8) translateY(20px);
            animation: modalSlideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s both;
            position: relative;
            overflow-y: auto;
        }

        @keyframes modalSlideUp {
            to {
                transform: scale(1) translateY(0);
            }
        }

        #closeModalButton{
            background-color: white;
            padding: 0;
            border: none;
            font-size: 1.7rem;
            font-weight: 500;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin: 0;
            cursor: pointer;
        }
        .modal-title { 
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            text-align: center;
        }
        
        .modal-btn { 
            flex:1; 
            padding: 8px 15px;
            font-size:14px; 
            margin:5px; 
            border-radius:6px; 
            text-align:center; 
            font-weight:bold; 
            cursor:pointer; 
            color:white; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-btn.green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .modal-btn.green:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
        }

        .modal-btn.gray {
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            color: white;
            box-shadow: 0 4px 15px rgba(107, 114, 128, 0.3);
        }

        .modal-btn.gray:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 114, 128, 0.4);
        }
        
        @media (max-width: 768px) {
            .navigationContainer, 
            .weekNavigationContainer {
                padding: .5rem .5rem;
            }
            .timetableContainer {
                padding: 0;
            }
            .mainContent{
                height: 77.5vh;
                padding: 5px;
            }
            #evTitle {
                font-size: 8px;
                color: #000;
            }
            #evInstructor {
                font-size: 7px;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div class="navigationContainer">
        <button id="backButton"><i class="bi bi-arrow-left"></i> Back</button>
        <button id="addButton" onclick="goToRoomSchedule()">Manage Schedule</button>
    </div>

    <div class="roomSemContainer">
        <h4 id="mainHeader-title">Room Assignment</h4>
        <h4 id="semesterInfo"></h4>
    </div>

    <div class="weekNavigationContainer">
        <button id="prevBtn" class="nav-button">
            <i class="bi bi-chevron-left"></i>
            Previous
        </button>
        <div class="week-range" id="weekRange">Loading...</div>
        <button id="nextBtn" class="nav-button">
            Next
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>

    <div class="timetableContainer">
        <div id="timetable" class="timetable"></div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <button id="closeModalButton" onclick="closeModal()"">x</button>
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalContent"></div>
            <div style="display:flex; margin-top:20px;" id="modalActions"></div>
        </div>
    </div>

    <div id="feedbackContainer"></div>


    <script>
        const API = "http://localhost:5000";
        const token = localStorage.getItem("accessToken");
        const role = localStorage.getItem("userRole");

        if (!token || role !== "admin") {
            window.location.href = "Login.html";
        }

        function decodeToken(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(base64));
            } catch (e) {
                console.error("Invalid token:", e);
                return null;
            }
        }
        const decoded = decodeToken(token);
        let userId = decoded.user_id;
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get("roomId");
        const roomName = urlParams.get("roomName");

        const semesterData = {};
        urlParams.forEach((value, key) => {
            if (key !== "roomId" && key !== "roomName") {
                semesterData[key] = value;
            }
        });

        const backButton = document.getElementById("backButton");
        backButton.addEventListener("click", () => {
            window.location.href = 'AdminManageRoom.html';
        });

        if(!roomId || !roomName){
            window.location.href = 'AdminManageRoom.html';
        }

        document.getElementById("mainHeader-title").innerText = "" + roomName + " - "
            + semesterData.sem_semester + ", SY: " + 
            semesterData.sem_school_year;

        const addDays = (d, days) => { let nd=new Date(d); nd.setDate(nd.getDate()+days); return nd; };
        const startOfWeek = (d) => { let nd=new Date(d); let day=nd.getDay(); let diff=(day===0?-6:1)-day; return addDays(nd,diff); };
        const endOfWeek = (d) => addDays(startOfWeek(d),6);
        const formatDate = (d) => d.toLocaleDateString("en-US",{month:"short",day:"2-digit"});
        const isSameDay = (a,b) => a.toDateString()===b.toDateString();

        const semesterStart=new Date(semesterData.sem_start_date);
        const semesterEnd=new Date(semesterData.sem_end_date);

        let today=new Date();
        let weekStart=startOfWeek(today);
        let events=[]; 
        let selectedEvent=null;

        function formatDates(date){
            if(!date) return '';
            const d = new Date(date);
            if(isNaN(d)) return date;
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = new Intl.DateTimeFormat('en-US', options).format(d);
            return formattedDate;
        }

        function getSubjectColor(type){ 
            return type==="Schedule"?"#FFF":"#bab5b5ff"; 
        }

        async function fetchTimetable(){
            const weekEnd=endOfWeek(weekStart);
            const start=weekStart.toISOString().slice(0,10);
            const end=weekEnd.toISOString().slice(0,10);

            try {
            const res=await fetch(`${API}/schedules/${roomId}/timetable?weekStart=${start}&weekEnd=${end}`);
            const data=await res.json();
            if(res.ok){
                const mapped=[];
                Object.keys(data.timetable||{}).forEach(day=>{
                data.timetable[day].forEach((s,idx)=>{
                    mapped.push({
                    id: day+"-"+idx,
                    schedule_id:s.schedule_id,
                    schedule_date:s.schedule_date,
                    title:s.subject_code,
                    title2:` (${s.year_section})`,
                    subtitle:s.instructor,
                    day,
                    start:(s.start_time||"00:00").slice(0,5),
                    end:(s.end_time||"00:00").slice(0,5),
                    oid:s.id,
                    color:getSubjectColor(s.type),
                    type:s.type
                    });
                });
                });
                events=mapped;
                positionEvents();
                renderTimetable();
            } else {
                return showFeedback("error", "Error", data.message || "Something went wrong.");
            }
            } catch(err){
                console.error("Fetch error:",err);
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        }

        function formatTime12(hour, minute) {
            let suffix = hour >= 12 ? "PM" : "AM";
            let h = hour % 12 || 12;
            return `${h}:${String(minute).padStart(2, "0")} ${suffix}`;
        }

        function fTime(timeStr){
            const [hour, minute] = timeStr.split(":");
            let h = parseInt(hour);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return `${h}:${minute} ${ampm}`;
        }

        function renderTimetable(){
            const weekEnd=endOfWeek(weekStart);
            document.getElementById("weekRange").innerText=`${formatDate(weekStart)} - ${formatDate(weekEnd)}`;

            const days=["Mon","Tue","Wed","Thu","Fri","Sat"];
            const weekDates=days.map((_,i)=>addDays(weekStart,i));
            const startHour=7,endHour=18,slotMinutes=60,rowHeight=40;

            const totalMinutes=(endHour-startHour)*60;
            const rowsCount=Math.ceil(totalMinutes/slotMinutes);

            let html="<div class='header-row'><div class='time-gutter'></div>";
            weekDates.forEach((d,i)=>{
            const isToday=isSameDay(d,today);
            html+=`<div class="header-cell ${isToday?"today":""}">${days[i]} ${d.getDate()}</div>`;
            });
            html+="</div>";

            html+="<div class='row'><div class='time-gutter'>";
            
            for(let i=0;i<=rowsCount;i++){
                let minutes=startHour*60+i*slotMinutes;
                let hour=Math.floor(minutes/60);
                let minute=minutes%60;
               

                html+=`<div class="time-cell">${formatTime12(hour, minute)}</div>`;
            }
            html+="</div>";

            weekDates.forEach((d,dayIdx)=>{
                html+=`<div class='day-column'>`;
                events.filter(ev=>ev._dayIdx===dayIdx).forEach(ev=>{
                    html+=`<div class="event" style="top:${ev._top}px;height:${ev._height}px;"
                    onclick="openModal('${ev.id}')">
                    <span id="evTitle">${ev.title||""}${ev.title2}</span>
                    <span id="evInstructor">${getInstructorName(ev.subtitle)}</span>
                    </div>`;
                });
                html+="</div>";
            });

            html+="</div>";
            document.getElementById("timetable").innerHTML=html;
        }

        function getInstructorName(instructorName){
            if(instructorName !== 'TBA'){
                const s = instructorName;
                const firstnameinitial = s[0];

                const words = s.split(' ');
                const lastname = words[words.length - 1];

                const okay = firstnameinitial+'. '+lastname;
                return okay;
            }else{
                return 'TBA'
            }
        }
        
        function positionEvents(){
            const dayToIndex={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
            const startHour=7,endHour=18,slotMinutes=60,rowHeight=40;
            const startMin=startHour*60;

            events=events.map((ev)=>{
                const [sh,sm]=ev.start.split(":").map(Number);
                const [eh,em]=ev.end.split(":").map(Number);
                const start=sh*60+sm, end=eh*60+em;
                const clampedStart=Math.max(start,startMin);
                const clampedEnd=Math.min(end,endHour*60);
                const minutesFromTop=clampedStart-startMin;
                const duration=Math.max(clampedEnd-clampedStart,0);
                return {...ev,_dayIdx:dayToIndex[ev.day]||0,_top:(minutesFromTop/slotMinutes)*rowHeight,_height:Math.max((duration/slotMinutes)*rowHeight,rowHeight/4)};
            });
        }

        fetch("Modal.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("feedbackContainer").innerHTML = html;
        });

        function showFeedback(type, title, message) {
            const modal = document.getElementById("feedbackModal");
            const icon = document.getElementById("feedbackIcon");
            const titleEl = document.getElementById("feedbackTitle");
            const msgEl = document.getElementById("feedbackMessage");

            icon.className = "bi";

            if (type === "success") {
                icon.classList.add("bi-check-circle-fill", "feedback-success");
            } else if (type === "error") {
                icon.classList.add("bi-x-circle-fill", "feedback-error");
            } else {
                icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
            }

            titleEl.textContent = title;
            msgEl.textContent = message;

            modal.style.display = "flex";

            document.getElementById("feedbackClose").onclick = () => {
                modal.style.display = "none";
            };

            modal.onclick = (e) => {
                if (e.target === modal) modal.style.display = "none";
            };
        }

        function goToRoomSchedule() {
            if (!roomId || !roomName || !semesterData) {
                showFeedback("warning", "Wait a minute.", "Room details not loaded yet.");
                return;
            }

            const encodedName = encodeURIComponent(roomName);
            let dataToPass = `roomId=${roomId}&roomName=${encodedName}`;

            if (semesterData) {
                Object.keys(semesterData).forEach(key => {
                    dataToPass += `&${encodeURIComponent(key)}=${encodeURIComponent(semesterData[key])}`;
                });
            }
            window.location.href=`AdminManageRoomSchedule.html?${dataToPass}`;
        }

        document.getElementById("prevBtn").onclick=()=>{
            const prev=addDays(weekStart,-7);
            if(prev>=semesterStart){ weekStart=prev; fetchTimetable(); }
        };
        document.getElementById("nextBtn").onclick=()=>{
            const next=addDays(weekStart,7);
            if(next<=semesterEnd){ weekStart=next; fetchTimetable(); }
        };

        function openModal(id) {
            selectedEvent = events.find(e => e.id === id);
            if (!selectedEvent) return;
            document.getElementById("modalTitle").innerText = selectedEvent.title+" "+selectedEvent.title2;
            document.getElementById("modalContent").innerHTML = `
                <p>Instructor: ${selectedEvent.subtitle||""}</p>
                <p>Date: ${formatDates(selectedEvent.schedule_date)}</p>
                <p>Time: ${fTime(selectedEvent.start)} - ${fTime(selectedEvent.end)}</p>
            `;
            // ✅ Build DateTime for comparison
            const now = new Date();
            const eventEnd = new Date(
                `${selectedEvent.schedule_date}T${selectedEvent.end}`
            );

            let actions = "";

            
            if(now < eventEnd){
                if(decoded.user_role === "admin"){
                    if (selectedEvent.type === "Schedule") {
                        actions += `<div class="modal-btn green" onclick="handleMakeAvailable()">Make Available</div>`;
                    }
                    if (selectedEvent.type === "Reservation") {
                        actions += `<div class="modal-btn green" onclick="handleRemove()">Remove</div>`;
                    }
                }
                
            }else{
                actions += `<div class="modal-btn gray" onclick="closeModal()">Close</div>`;
            }
            document.getElementById("modalActions").innerHTML = actions;
            document.getElementById("modal").style.display="flex";
        }

        function closeModal(){ 
            document.getElementById("modal").style.display="none"; 
            selectedEvent=null; 
        }

        async function handleMakeAvailable() {
            if (!selectedEvent) return;
            try {
            const res = await fetch(
                `${API}/schedules/${selectedEvent.oid}/sched`,
                { method: "DELETE", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                user_id: userId,
                }),
                }
            );
            const data = await res.json();
            if (res.ok) {
                showFeedback("success", "Success!", "Schedule removed successfully!");
                selectedEvent = null;
                fetchTimetable();
                closeModal();
            } else {
                return showFeedback("error", "Error", data.message || "Something went wrong.");
            }
            } catch (err) {
                console.error("Error removing occurrence:", err);
               showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        }

        async function handleRemove() {
            if (!selectedEvent) return;
            try {
            const res = await fetch(
                `${API}/room-reservations/${selectedEvent.oid}/remove`,
                { method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                user_id: userId,
                }), }
            );
            const data = await res.json();
            if (res.ok) {
                showFeedback("success", "Success!", "Schedule removed successfully!");
                selectedEvent = null;
                fetchTimetable();
                closeModal();
            } else {
                return showFeedback("error", "Error", data.message || "Something went wrong.");
            }
            } catch (err) {
                console.error("Error cancelling reservation:", err);
                showFeedback("error", "Network Error", "Unable to connect to the server.");
            }
        }

        function makeAvailable(){ 
            alert("Make Available for "+selectedEvent.title); 
            closeModal(); 
        }
        function removeReservation(){ 
            alert("Remove Reservation for "+selectedEvent.title); 
            closeModal(); 
        }
        
        fetchTimetable();
    </script>
</body>
</html>
