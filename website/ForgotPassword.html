<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(rgba(30,60,114,0.95), rgba(42,82,152,0.95)), 
                    url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23e3f2fd" width="1200" height="600"/><circle fill="%231e3c72" opacity="0.1" cx="200" cy="150" r="80"/><circle fill="%232a5298" opacity="0.1" cx="1000" cy="400" r="120"/><path fill="%23bbdefb" opacity="0.3" d="M0 300 Q300 200 600 350 Q900 450 1200 300 L1200 600 L0 600 Z"/></svg>');
        background-size: cover;
        background-attachment: fixed;
        padding: 2rem;
    }

    .forgot-container {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(15px);
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 440px;
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.2);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        position: relative;
        overflow: hidden;
        animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .forgot-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #ff6b35, #1e3c72, #ff6b35);
        background-size: 200% 100%;
        animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Title */
    h2 {
        font-size: 2rem;
        font-weight: 700;
        color: #1e3c72;
        margin-bottom: 0.75rem;
        line-height: 1.2;
    }

    .subtitle {
        color: #64748b;
        font-size: 1.05rem;
        margin-bottom: 2.5rem;
        font-weight: 400;
        line-height: 1.5;
    }

    /* Form Elements */
    .input-group {
        position: relative;
        margin-bottom: 2rem;
        text-align: left;
    }

    .input-group label {
        display: block;
        margin-bottom: 0.75rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: #374151;
    }

    .input-group input,
    .input-group select {
        width: 100%;
        padding: 1.25rem 1.5rem;
        border: 3px solid #e2e8f0;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.8);
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
        appearance: none;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .input-group input:focus,
    .input-group select:focus {
        border-color: #ff6b35;
        box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15), 0 15px 35px rgba(255, 107, 53, 0.2);
        transform: translateY(-2px);
        background: white;
    }

    .input-group select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 1rem center;
        background-repeat: no-repeat;
        background-size: 1.2em;
        padding-right: 3rem;
    }

    .input-group input.error {
        border-color: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
    }

    .error {
        font-size: 0.85rem;
        color: #ef4444;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .success {
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        color: #166534;
        border: 1px solid #86efac;
        border-radius: 16px;
        padding: 1.25rem;
        margin-bottom: 1.75rem;
        font-weight: 500;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        animation: successSlide 0.5s ease-out;
    }

    @keyframes successSlide {
        from {
            opacity: 0;
            transform: translateX(-20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Button */
    .reset-btn {
        width: 100%;
        padding: 1.3rem 2rem;
        border-radius: 18px;
        border: none;
        background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 12px 30px rgba(255, 107, 53, 0.35);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
    }

    .reset-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.6s;
    }

    .reset-btn:hover::before {
        left: 100%;
    }

    .reset-btn:hover:not(:disabled) {
        transform: translateY(-4px);
        box-shadow: 0 20px 45px rgba(255, 107, 53, 0.45);
    }

    .reset-btn:active {
        transform: translateY(-2px);
    }

    .reset-btn:disabled {
        background: linear-gradient(135deg, #ffa48d, #ffb3a7);
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 6px 20px rgba(255, 107, 53, 0.2);
    }

    /* Login Link */
    .login-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1.25rem;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        border-radius: 16px;
        border: 2px solid #e2e8f0;
        transition: all 0.3s ease;
    }

    .login-link:hover {
        background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
        border-color: #cbd5e1;
        transform: translateY(-1px);
    }

    .login-link a {
        color: #1e3c72;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.98rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .login-link a:hover {
        color: #ff6b35;
    }

    /* Responsive */
    @media (max-width: 480px) {
        body {
            padding: 1rem;
        }
        
        .forgot-container {
            padding: 2.5rem 2rem;
            margin: 0.5rem;
        }
        
        h2 {
            font-size: 1.65rem;
        }
        
        .input-group input {
            padding: 1.1rem 1.25rem;
            font-size: 0.95rem;
        }
    }
</style>
</head>

<body>

<div class="forgot-container">
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your CBSUA email address and we'll send you a 6-digit verification code to reset your password.</p>

    <form id="forgotForm">

        <div class="success" id="successMessage" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <span>OTP sent successfully! Redirecting...</span>
        </div>

        <div class="input-group">
            <label><i class="fas fa-envelope"></i> CBSUA Email</label>
            <input type="email" id="email" placeholder="example@cbsua.edu.ph" required>
            <div class="error" id="emailError">
                <span></span>
            </div>
        </div>

        <!-- Role -->
        <div class="input-group">
            <label><i class="fas fa-user-tag input-icon"></i> Role</label>
            <div class="input-wrapper">
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="admin">Admin</option>
                    <option value="instructor">Instructor</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="error" id="roleError"></div>
        </div>

        <button type="submit" class="reset-btn" id="resetBtn">
            <span id="btnText">
                <i class="fas fa-paper-plane"></i>
                Send Reset Code
            </span>
        </button>

        <div class="login-link">
            <a href="Login.html">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>

    </form>
</div>

<div id="feedbackContainer"></div>

<script>
    const API = "http://localhost:5000";
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const role = document.getElementById("role");
    const emailError = document.getElementById("emailError");
    const roleError = document.getElementById("roleError");
    const successMessage = document.getElementById("successMessage");
    const resetBtn = document.getElementById("resetBtn");
    const btnText = document.getElementById("btnText");

    // Real-time email validation
    emailInput.addEventListener("input", function() {
        const emailValue = this.value.trim();
        const emailPattern = /^[A-Za-z0-9._%+-]+@cbsua\.edu\.ph$/i;
        
        emailError.style.display = "none";
        emailInput.classList.remove("error");
        
        if (emailValue && !emailPattern.test(emailValue)) {
            showError("Please use a valid CBSUA email (must end with @cbsua.edu.ph)");
        }
    });

    form.addEventListener("submit", async function(e){
        e.preventDefault();

        emailError.textContent = "";
        roleError.textContent = "";
        successMessage.textContent = "";

        const emailValue = email.value.trim();
        const emailPattern = /^[A-Za-z0-9._%+-]+@cbsua\.edu\.ph$/i;

        if(!emailValue){
            emailError.textContent = "Email is required.";
            return;
        }

        if(!emailPattern.test(emailValue)){
            emailError.textContent = "Email must end with @cbsua.edu.ph";
            return;
        }

        // Role
        if (role.value === "") {
            document.getElementById("roleError").textContent = "Please select a role.";
            return;
        }

        // 🔒 Disable button while loading
        resetBtn.disabled = true;
        btnText.textContent = "Sending...";

        try{
            const res = await fetch(`${API}/auth/forgotPassword`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({ 
                    email: emailValue,
                    role: role.value
                 })
            });

            const data = await res.json();

            if(!res.ok){
                showFeedback("error", "Error", data.message || "Failed to send OTP");
                resetBtn.disabled = false;
                btnText.textContent = "Send OTP";
                return;
            }

            // Save email and role for OTP page
            successMessage.textContent = data.message || "OTP sent successfully!";
            showFeedback("success", "Success", data.message);
            localStorage.setItem("otp_email", emailValue);
            localStorage.setItem("otp_role", role.value);

            const status = "resetPassword";
            window.location.href = "OTP.html?status=" + encodeURIComponent(status);

        }catch(err){
            console.error(err);
            showFeedback("error", "Network Error", "Unable to connect to the server.");
            resetBtn.disabled = false;
            btnText.textContent = "Send OTP";
        }
    });

    function showError(message) {
        const errorSpan = emailError.querySelector("span");
        errorSpan.textContent = message;
        emailError.style.display = "flex";
        emailInput.classList.add("error");
        emailInput.focus();
    }

    fetch("Modal.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("feedbackContainer").innerHTML = html;
    });

    function showFeedback(type, title, message) {
        const modal = document.getElementById("feedbackModal");
        const icon = document.getElementById("feedbackIcon");
        const titleEl = document.getElementById("feedbackTitle");
        const msgEl = document.getElementById("feedbackMessage");

        icon.className = "bi";

        if (type === "success") {
            icon.classList.add("bi-check-circle-fill", "feedback-success");
        } else if (type === "error") {
            icon.classList.add("bi-x-circle-fill", "feedback-error");
        } else {
            icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
        }

        titleEl.textContent = title;
        msgEl.textContent = message;

        modal.style.display = "flex";

        document.getElementById("feedbackClose").onclick = () => {
            modal.style.display = "none";
        };

        modal.onclick = (e) => {
            if (e.target === modal) modal.style.display = "none";
        };
    }
</script>

</body>
</html>
