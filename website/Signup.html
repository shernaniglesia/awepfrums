<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIT CBSUA-Sipocot - Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e3c72;
            --secondary-blue: #2a5298;
            --primary-orange: #ff6b35;
            --orange-hover: #ff8c5a;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --dark-text: #333;
            --gray-text: #666;
            --light-gray: #e5e7eb;
            --border-gray: #d1d5db;
            --error-red: #ef4444;
            --success-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(30,60,114,0.95), rgba(42,82,152,0.95)), 
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%23e3f2fd" width="1200" height="600"/><circle fill="%231e3c72" opacity="0.1" cx="200" cy="150" r="80"/><circle fill="%232a5298" opacity="0.1" cx="1000" cy="400" r="120"/><path fill="%23bbdefb" opacity="0.3" d="M0 300 Q300 200 600 350 Q900 450 1200 300 L1200 600 L0 600 Z"/></svg>');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .signup-container {
            background: var(--white);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .signup-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-orange), var(--primary-blue));
        }

        .logo-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .signup-subtitle {
            color: var(--gray-text);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 500;
            color: var(--dark-text);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid var(--light-gray);
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--light-bg);
            transition: all 0.3s ease;
            outline: none;
            appearance: none;
        }

        .input-group select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.2em;
            padding-right: 3rem;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary-orange);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
            transform: translateY(-1px);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-text);
            font-size: 1.1rem;
            z-index: 2;
        }

        .toggle-password {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--primary-orange);
            transition: all 0.3s ease;
            user-select: none;
        }

        .toggle-password:hover {
            color: var(--orange-hover);
            transform: translateY(-50%) scale(1.1);
        }

        .error {
            font-size: 0.8rem;
            color: var(--error-red);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .signup-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary-orange), var(--orange-hover));
            border: none;
            color: var(--white);
            border-radius: 16px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255,107,53,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 1rem 0;
        }

        .signup-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255,107,53,0.5);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            background: var(--border-gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--light-gray);
            font-size: 0.95rem;
        }

        .login-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            color: var(--secondary-blue);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success/Error states */
        .input-group.success input,
        .input-group.success select {
            border-color: var(--success-green);
            background: rgba(16,185,129,0.05);
        }

        .input-group.error input,
        .input-group.error select {
            border-color: var(--error-red);
            background: rgba(239,68,68,0.05);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            
            .signup-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .signup-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo-header">
        <h1 class="signup-title">Create Account</h1>
        <p class="signup-subtitle">Join CIT CBSUA-Sipocot Resource System</p>
    </div>

    <form id="signupForm">
        <!-- Name -->
        <div class="input-group">
            <label>Full Name</label>
            <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="error" id="nameError"></div>
        </div>

        <!-- Email -->
        <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="your.email@cbsua.edu.ph" required>
            </div>
            <div class="error" id="emailError"></div>
        </div>

        <!-- Role -->
        <div class="input-group">
            <label>Role</label>
            <div class="input-wrapper">
                <i class="fas fa-user-tag input-icon"></i>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="instructor">Instructor</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="error" id="roleError"></div>
        </div>

        <!-- Password -->
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Create password" required>
                <i class="fas fa-eye-slash toggle-password" data-target="password"></i>
            </div>
            <div class="error" id="passwordError"></div>
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                <i class="fas fa-eye-slash toggle-password" data-target="confirmPassword"></i>
            </div>
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="signup-btn" id="signupBtn">
            <span class="btn-text">Create Account</span>
            <i class="fas fa-user-plus"></i>
            <span class="spinner" id="spinner"></span>
        </button>

        <div class="login-link">
            Already have an account? 
            <a href="Login.html">Sign In</a>
        </div>
    </form>
</div>

<div id="feedbackContainer"></div>

<script>
    const API = "http://localhost:5000";

    const form = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const spinner = document.getElementById("spinner");
    const btnText = document.querySelector(".btn-text");

    // Eye icon toggle functionality
    document.querySelectorAll('.toggle-password').forEach(icon => {
        icon.addEventListener('click', function() {
            const targetId = this.dataset.target;
            const field = document.getElementById(targetId);
            const isPassword = field.type === 'password';
            
            field.type = isPassword ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash', isPassword);
            this.classList.toggle('fa-eye', !isPassword);
        });
    });

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        let valid = true;

        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const role = document.getElementById("role");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        document.querySelectorAll(".error").forEach(el => el.textContent = "");

        const emailPattern = /^[A-Za-z0-9._%+-]+@cbsua\.edu\.ph$/i;

        // Name
        if (name.value.trim() === "") {
            document.getElementById("nameError").textContent = "Name is required.";
            valid = false;
        }

        // Email
        if (email.value.trim() === "") {
            document.getElementById("emailError").textContent = "Email is required.";
            valid = false;
        } else if (!emailPattern.test(email.value)) {
            document.getElementById("emailError").textContent = "Use your CBSUA email only.";
            valid = false;
        }

        // Role
        if (role.value === "") {
            document.getElementById("roleError").textContent = "Please select a role.";
            valid = false;
        }

        // Password
        const passValue = password.value;

        if (passValue.trim() === "") {
            document.getElementById("passwordError").textContent = "Password is required.";
            valid = false;
        } else if (passValue.length < 8) {
            document.getElementById("passwordError").textContent = "Minimum 8 characters.";
            valid = false;
        } else if (!/[A-Z]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain uppercase letter.";
            valid = false;
        } else if (!/[a-z]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain lowercase letter.";
            valid = false;
        } else if (!/[0-9]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain a number.";
            valid = false;
        } else if (!/[@$!%*?&]/.test(passValue)) {
            document.getElementById("passwordError").textContent = "Must contain special character.";
            valid = false;
        }

        // Confirm password
        if (confirmPassword.value.trim() === "") {
            document.getElementById("confirmPasswordError").textContent = "Confirm your password.";
            valid = false;
        } else if (confirmPassword.value !== passValue) {
            document.getElementById("confirmPasswordError").textContent = "Passwords do not match.";
            valid = false;
        }

        if (!valid) return;

        signupBtn.disabled = true;
        spinner.style.display = "inline-block";
        btnText.style.display = "none";

        try {
            const res = await fetch(`${API}/auth/signup`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name.value,
                    email: email.value,
                    password: passValue,
                    role: role.value
                })
            });

            const data = await res.json();

            if (!res.ok) {
                //alert(data.message || "Signup failed");
                showFeedback("error", "Error", data.message || "Signup failed");
                signupBtn.disabled = false;
                spinner.style.display = "none";
                btnText.style.display = "inline";
                return;
            }

            //alert("Verification email sent! Please check your inbox.");
            showFeedback("success", "Success", "Verification email sent! Please check your inbox.");
            localStorage.setItem("otp_role", role.value);
            localStorage.setItem("otp_email", email.value);
            
            window.location.href="OTP.html";

        } catch (err) {
            console.error(err);
            //alert("Unable to contact server");
            showFeedback("error", "Network Error", "Unable to connect to the server.");

            signupBtn.disabled = false;
            spinner.style.display = "none";
            btnText.style.display = "inline";
        }
    });

    fetch("Modal.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("feedbackContainer").innerHTML = html;
    });

    function showFeedback(type, title, message) {
        const modal = document.getElementById("feedbackModal");
        const icon = document.getElementById("feedbackIcon");
        const titleEl = document.getElementById("feedbackTitle");
        const msgEl = document.getElementById("feedbackMessage");

        icon.className = "bi";

        if (type === "success") {
            icon.classList.add("bi-check-circle-fill", "feedback-success");
        } else if (type === "error") {
            icon.classList.add("bi-x-circle-fill", "feedback-error");
        } else {
            icon.classList.add("bi-exclamation-circle-fill", "feedback-warning");
        }

        titleEl.textContent = title;
        msgEl.textContent = message;

        modal.style.display = "flex";

        document.getElementById("feedbackClose").onclick = () => {
            modal.style.display = "none";
        };

        modal.onclick = (e) => {
            if (e.target === modal) modal.style.display = "none";
        };
    }
</script>

</body>
</html>
